services:
  pong:
    image: ${PONG_IMAGE:?Set PONG_IMAGE to your Docker Hub image, for example username/javascript-pong:latest}
    container_name: javascript-pong
    restart: unless-stopped
    ports:
      - "${PONG_PORT:-8080}:8080"
    environment:
      PORT: 8080
      DATABASE_PATH: /app/data/arcade.sqlite
      RECONNECT_GRACE_MS: ${RECONNECT_GRACE_MS:-15000}
      ROOM_TIMEOUT_MS: ${ROOM_TIMEOUT_MS:-1800000}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://js-playground.tail01f640.ts.net}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    volumes:
      - arcade-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
volumes:
  arcade-data:
