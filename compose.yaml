services:
  js-playground:
    image: js-playground:${BUILD_VERSION:-dev}
    build:
      context: .
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
        BUILD_CHANNEL: ${BUILD_CHANNEL:-dev}
    container_name: ${JSPG_CONTAINER_NAME:-javascript-playground}
    restart: unless-stopped
    ports:
      - "${JSPG_PORT:-8080}:8080"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 8080
      DATABASE_PATH: /app/data/arcade.sqlite
      HTTP_BODY_MAX_IN_FLIGHT_BYTES: ${HTTP_BODY_MAX_IN_FLIGHT_BYTES:-16777216}
      HTTP_BODY_MAX_IN_FLIGHT_BYTES_PER_IP: ${HTTP_BODY_MAX_IN_FLIGHT_BYTES_PER_IP:-4194304}
      HTTP_BODY_TIMEOUT_MS: ${HTTP_BODY_TIMEOUT_MS:-30000}
      SAVE_MAX_BYTES_PER_USER: ${SAVE_MAX_BYTES_PER_USER:-16777216}
      SAVE_MAX_TOTAL_BYTES: ${SAVE_MAX_TOTAL_BYTES:-536870912}
      RECONNECT_GRACE_MS: ${RECONNECT_GRACE_MS:-15000}
      ROOM_TIMEOUT_MS: ${ROOM_TIMEOUT_MS:-1800000}
      ROOM_MAX_TOTAL: ${ROOM_MAX_TOTAL:-200}
      ROOM_MAX_PER_GAME: ${ROOM_MAX_PER_GAME:-100}
      ROOM_MAX_PER_IP: ${ROOM_MAX_PER_IP:-5}
      PUBLIC_ROOM_LIMIT: ${PUBLIC_ROOM_LIMIT:-50}
      WS_MAX_CONNECTIONS: ${WS_MAX_CONNECTIONS:-250}
      WS_MAX_CONNECTIONS_PER_IP: ${WS_MAX_CONNECTIONS_PER_IP:-20}
      WS_MESSAGES_PER_10S: ${WS_MESSAGES_PER_10S:-300}
      WS_ROOM_CREATES_PER_MINUTE: ${WS_ROOM_CREATES_PER_MINUTE:-10}
      WS_JOINS_PER_MINUTE: ${WS_JOINS_PER_MINUTE:-60}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    volumes:
      - arcade-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
volumes:
  arcade-data:
