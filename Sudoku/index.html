<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f1e8">
    <title>Sudoku · Daily focus</title>
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="app-shell">
        <header class="topbar">
            <a class="brand" href="../index.html" aria-label="Back to games">
                <span class="brand-mark" aria-hidden="true">S</span>
                <span>Sudoku</span>
            </a>
            <button class="icon-button" id="new-game-top" type="button" aria-label="Start a new game" title="New game">↻</button>
        </header>

        <section class="intro" aria-labelledby="page-title">
            <div>
                <p class="eyebrow">A quiet challenge</p>
                <h1 id="page-title">Find your focus.</h1>
                <p>Fill every row, column and 3 × 3 box with the numbers 1–9.</p>
            </div>
            <div class="stats" aria-label="Game status">
                <div><span>Difficulty</span><strong id="difficulty-label">Medium</strong></div>
                <div><span>Time</span><strong id="timer">00:00</strong></div>
                <div><span>Mistakes</span><strong><span id="mistakes">0</span> / 3</strong></div>
            </div>
        </section>

        <section class="game-layout">
            <div>
                <div id="status" class="status" role="status" aria-live="polite">Select an empty square to begin.</div>
                <div id="board" class="board" role="grid" aria-label="Sudoku puzzle"></div>
            </div>

            <aside class="controls" aria-label="Game controls">
                <div class="tool-row">
                    <button class="tool" id="erase" type="button"><span aria-hidden="true">⌫</span>Erase</button>
                    <button class="tool" id="notes" type="button" aria-pressed="false"><span aria-hidden="true">✎</span>Notes <small>Off</small></button>
                    <button class="tool" id="hint" type="button"><span aria-hidden="true">◇</span>Hint</button>
                </div>
                <div id="number-pad" class="number-pad" aria-label="Number pad"></div>
                <button class="primary-button" id="new-game" type="button">New game</button>
                <label class="difficulty-control" for="difficulty">
                    <span>Choose difficulty</span>
                    <select id="difficulty">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </label>
                <p class="keyboard-tip"><kbd>1</kbd>–<kbd>9</kbd> to enter · <kbd>N</kbd> for notes · Arrow keys to move</p>
            </aside>
        </section>
    </main>

    <div class="modal" id="finish-modal" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="finish-title">
            <div class="celebration" aria-hidden="true">✦</div>
            <p class="eyebrow">Puzzle complete</p>
            <h2 id="finish-title">Beautifully done.</h2>
            <p id="finish-summary">You completed the puzzle.</p>
            <button class="primary-button" id="play-again" type="button">Play another</button>
        </div>
    </div>
    <script src="scripts/app.js"></script>
</body>
</html>
