<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f1e8">
    <meta name="description" content="A polished, responsive take on the original arcade Pong."><title>Pong · Keep the rally alive</title>
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon"><link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="app-shell">
    <header class="topbar"><a class="brand" href="../index.html" aria-label="Back to games"><span class="brand-mark" aria-hidden="true">P</span><span>Pong</span></a><a class="version-link" href="classic/index.html">Play classic</a></header>
    <section class="intro" aria-labelledby="page-title"><div><p class="eyebrow">The original rally</p><h1 id="page-title">Keep it moving.</h1><p class="intro-copy">Meet the ball, hold your line and outlast your opponent. First to seven takes the match.</p></div><div class="scoreboard" aria-label="Score"><div class="score"><span>Left</span><strong id="score-left">0</strong></div><span class="score-divider">—</span><div class="score"><span>Right</span><strong id="score-right">0</strong></div></div></section>
    <section class="game-layout">
        <div class="arena-wrap"><canvas id="game" width="960" height="600" aria-label="Pong game arena"></canvas><button class="arena-message" id="arena-message" type="button"><strong>Ready to rally?</strong><span>Click or press Space to serve</span></button></div>
        <aside class="controls" aria-label="Game controls"><div id="status" class="status" role="status" aria-live="polite">Choose your match and start the rally.</div><div class="mode-switch" aria-label="Game mode"><button type="button" data-mode="solo" aria-pressed="true">Solo</button><button type="button" data-mode="duo" aria-pressed="false">Two players</button></div><button class="primary-button" id="new-game" type="button">New match</button><button class="secondary-button" id="pause" type="button">Pause / resume</button><div class="touch-controls" aria-label="Touch paddle controls"><button type="button" data-key="KeyW" aria-label="Move left paddle up">↑</button><button type="button" data-key="KeyS" aria-label="Move left paddle down">↓</button></div><p class="instructions"><strong>Left paddle</strong> <kbd>W</kbd> <kbd>S</kbd><br><strong>Right paddle</strong> <kbd>↑</kbd> <kbd>↓</kbd> in two-player mode<br><kbd>Space</kbd> pauses and resumes</p></aside>
    </section>
</main><script src="scripts/app.js"></script>
</body></html>
